[package]
name = "git-remote-twigpine"
description = "Git remote helper — enables 'git clone twigpine://did:key:...'"
version = "0.9.0" # x-release-please-version
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "git-remote-twigpine"

[[bin]]
name = "git-remote-twigpine"
path = "src/main.rs"

# The same program under the name git looks for today. Git picks a remote
# helper by URL scheme, so a `gitlawb://` remote runs `git-remote-gitlawb`.
# Building it here means a source build, `cargo install` and the tests all get
# a working helper without a separate link step. The unit tests already run
# once for the bin above.
[[bin]]
name = "git-remote-gitlawb"
path = "src/main.rs"
test = false

[dependencies]
twigpine-core = { path = "../twigpine-core", features = ["redirect"] }
anyhow = { workspace = true }
reqwest = { workspace = true }
# Reading the node's DID from `GET /` so a delegated push can address its
# invocation to the right executor.
serde_json = { workspace = true }
# The invocation carries the delegation's expiry, so an unbounded write capability
# is never minted; converting the stored i64 timestamp needs chrono.
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Home-directory lookup for the shared TWIGPINE_KEY resolver in twigpine-core,
# which takes `home` as an argument so core's dependency allowlist stays lean.
dirs = "5"

[dev-dependencies]
mockito = "1"
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[target.'cfg(windows)'.dev-dependencies]
# Job Object bindings for the real_git_fetch harness: the Windows analog of the
# unix process-group teardown, so the whole `git fetch` tree can be killed
# together on both the timeout and clean-exit paths (INV-22). Win32_Security is
# required by CreateJobObjectW, and Win32_System_Threading by
# JOBOBJECT_EXTENDED_LIMIT_INFORMATION (it embeds IO_COUNTERS).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
